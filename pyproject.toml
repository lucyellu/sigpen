[project]
name = "sigpen-api"
version = "0.1.0"
description = "Sun-Earth Translator backend"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "httpx>=0.27",
    "apscheduler>=3.10",
    "duckdb>=1.1",
    "pandas>=2.2",
    "pyarrow>=17",
]

[tool.setuptools.packages.find]
include = ["api*"]

[tool.uv]
dev-dependencies = [
    "pytest>=8",
    "ruff>=0.6",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
